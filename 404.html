@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2")}

:root{

  --hueso:#FAF6EF; --gutter:clamp(16px,4vw,40px);
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:48px var(--gutter);text-align:center;
  background:var(--noche);color:var(--hueso);font-family:var(--sans)}
.logo{width:92px;height:92px;margin-bottom:26px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;margin:0;

.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:currentColor;opacity:.7}
.num{font-family:var(--serif);font-weight:500;line-height:.9;font-size:clamp(88px,18vw,180px);

h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5.4vw,56px);line-height:1.08;margin:0 0 18px}
h1 em{font-style:italic;color:var(--ambar-suave)}
p{max-width:46ch;margin:0 0 34px;font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:rgba(250,246,239,.72)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 26px;
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
  border-radius:2px;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-rojo:hover{background:#DB3A2C}
.btn-linea{border-color:rgba(250,246,239,.42);color:var(--hueso)}
.btn-linea:hover{border-color:var(--ambar);color:var(--ambar-suave)}
@media (max-width:420px){.btn{width:100%}}
</style>
